<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bass Dokus</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    margin: 0;
    background: #f4f4f4;
}

h1 {
    margin-bottom: 8px;
}

#diapason {
    position: relative;
    width: 100%;
    max-width: 1280px;
    margin: 20px auto;
    line-height: 0;
}

#diapason img {
    display: block;
    width: 100%;
    height: auto;
}

/* Círculos de las notas */
.nota {
    position: absolute;
    width: clamp(10px, 1.4vw, 18px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 2px solid white;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
}

#tonica {
    background: #22c55e;
}

#notaAzul {
    background: #3b82f6;
}

/* Respuestas */
#opciones {
    display: grid;
    grid-template-columns: repeat(4, minmax(65px, 140px));
    justify-content: center;
    gap: 9px;
    margin: 22px auto;
    padding: 0 10px;
}

#opciones button {
    background: #222;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    min-height: 44px;
}

#opciones button:hover {
    background: #444;
}

#opciones button:disabled {
    cursor: default;
    opacity: 0.75;
}

#mensaje {
    min-height: 28px;
    font-weight: bold;
    margin: 15px;
}

#nuevo {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 12px;
}

#nuevo:hover {
    background: #1d4ed8;
}

#marcador {
    margin-top: 15px;
    font-size: 15px;
}

#explicacion {
    font-size: 12px;
    color: #666;
    margin-top: 18px;
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    #opciones {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
    }

    #opciones button {
        font-size: 14px;
        padding: 12px 4px;
    }
}
</style>
</head>

<body>

<h1>🎸 Bass Dokus</h1>
<p>¿Qué intervalo es la nota azul respecto a la verde?</p>

<div id="diapason">
    <img id="imagenBajo" src="bass3.png" alt="Diapasón de bajo">

    <div id="tonica" class="nota"></div>
    <div id="notaAzul" class="nota"></div>
</div>

<div id="opciones"></div>

<div id="mensaje">¡Identifica el intervalo!</div>

<button id="nuevo" onclick="nuevoEjercicio()">
    Nuevo ejercicio
</button>

<div id="marcador">
    Aciertos: <span id="aciertos">0</span>
    &nbsp; | &nbsp;
    Errores: <span id="errores">0</span>
</div>

<p id="explicacion">
    Afinación estándar E-A-D-G · 20 trastes. La nota verde es la referencia.
</p>

<script>

// ---------------------------------
// CONFIGURACIÓN DEL DIAPASÓN
// ---------------------------------

const ANCHO_IMAGEN = 1280;
const ALTO_IMAGEN = 720;

// Posición de la cejuela en la imagen original
const X_CEUELA = 1000;

// Longitud de escala estimada en píxeles
const LONGITUD_ESCALA = 1400;

// Cuerdas: E, A, D, G
// MIDI estándar: E1=28, A1=33, D2=38, G2=43

const cuerdas = [
    { nombre: "E", midi: 28, y: 421 },
    { nombre: "A", midi: 33, y: 396 },
    { nombre: "D", midi: 38, y: 370 },
    { nombre: "G", midi: 43, y: 344 }
];

const NUM_TRASTES = 20;


// ---------------------------------
// INTERVALOS
// ---------------------------------

const intervalos = [
    { nombre: "T", semitonos: 0 },
    { nombre: "b2", semitonos: 1 },
    { nombre: "2", semitonos: 2 },
    { nombre: "b3", semitonos: 3 },
    { nombre: "3", semitonos: 4 },
    { nombre: "4", semitonos: 5 },
    { nombre: "4#", semitonos: 6 },
    { nombre: "b5", semitonos: 6 },
    { nombre: "5", semitonos: 7 },
    { nombre: "5#", semitonos: 8 },
    { nombre: "b6", semitonos: 8 },
    { nombre: "6", semitonos: 9 },
    { nombre: "bb7", semitonos: 9 },
    { nombre: "b7", semitonos: 10 },
    { nombre: "7", semitonos: 11 }
];


// ---------------------------------
// POSICIÓN DE LOS TRASTES
// ---------------------------------

// Coordenada de cada barra de traste.
// Los trastes se estrechan progresivamente
// al alejarse de la cejuela.

function limiteTraste(traste) {
    return X_CEUELA -
        LONGITUD_ESCALA *
        (1 - Math.pow(2, -traste / 12));
}


// Centro del espacio donde se coloca la nota.

function calcularX(traste) {

    // Nota al aire: se coloca justo al lado de la cejuela.
    if (traste === 0) {
        return (X_CEUELA + 12) / ANCHO_IMAGEN * 100;
    }

    const derecha = limiteTraste(traste - 1);
    const izquierda = limiteTraste(traste);

    const centro = (derecha + izquierda) / 2;

    return centro / ANCHO_IMAGEN * 100;
}


// ---------------------------------
// OBTENER NOTA MIDI
// ---------------------------------

function obtenerMidi(posicion) {
    return cuerdas[posicion.cuerda].midi + posicion.traste;
}


// ---------------------------------
// CALCULAR INTERVALO
// ---------------------------------

function calcularIntervalo(posicionVerde, posicionAzul) {

    const midiVerde = obtenerMidi(posicionVerde);
    const midiAzul = obtenerMidi(posicionAzul);

    return Math.abs(midiAzul - midiVerde) % 12;
}


// ---------------------------------
// ELEGIR POSICIONES ALEATORIAS
// ---------------------------------

function posicionAleatoria() {

    return {
        cuerda: Math.floor(Math.random() * cuerdas.length),
        traste: Math.floor(Math.random() * (NUM_TRASTES + 1))
    };
}


// ---------------------------------
// COLOCAR LOS CÍRCULOS
// ---------------------------------

function colocarNota(elemento, posicion) {

    const x = calcularX(posicion.traste);
    const y = cuerdas[posicion.cuerda].y / ALTO_IMAGEN * 100;

    elemento.style.left = x + "%";
    elemento.style.top = y + "%";
}


// ---------------------------------
// VARIABLES DEL JUEGO
// ---------------------------------

let posicionVerde;
let posicionAzul;
let intervaloCorrecto;

let aciertos = 0;
let errores = 0;
let respondido = false;


// ---------------------------------
// CREAR BOTONES
// ---------------------------------

const contenedorOpciones = document.getElementById("opciones");

intervalos.forEach(intervalo => {

    const boton = document.createElement("button");

    boton.textContent = intervalo.nombre;

    boton.onclick = function() {
        comprobarRespuesta(intervalo.nombre);
    };

    contenedorOpciones.appendChild(boton);
});


// ---------------------------------
// NUEVO EJERCICIO
// ---------------------------------

function nuevoEjercicio() {

    respondido = false;

    document.getElementById("mensaje").textContent =
        "¡Identifica el intervalo!";

    document.querySelectorAll("#opciones button").forEach(boton => {
        boton.disabled = false;
    });

    posicionVerde = posicionAleatoria();
    posicionAzul = posicionAleatoria();

    // Evitar que las dos notas estén exactamente
    // en la misma cuerda y el mismo traste.

    while (
        posicionVerde.cuerda === posicionAzul.cuerda &&
        posicionVerde.traste === posicionAzul.traste
    ) {
        posicionAzul = posicionAleatoria();
    }

    intervaloCorrecto = calcularIntervalo(
        posicionVerde,
        posicionAzul
    );

    colocarNota(
        document.getElementById("tonica"),
        posicionVerde
    );

    colocarNota(
        document.getElementById("notaAzul"),
        posicionAzul
    );
}


// ---------------------------------
// COMPROBAR RESPUESTA
// ---------------------------------

function comprobarRespuesta(respuesta) {

    if (respondido) return;

    respondido = true;

    const respuestasValidas = intervalos.filter(
        intervalo => intervalo.semitonos === intervaloCorrecto
    );

    const esCorrecta = respuestasValidas.some(
        intervalo => intervalo.nombre === respuesta
    );

    if (esCorrecta) {

        aciertos++;

        document.getElementById("mensaje").textContent =
            "¡Correcto! 🎉";

        document.getElementById("mensaje").style.color =
            "#16a34a";

    } else {

        errores++;

        const nombresCorrectos = respuestasValidas
            .map(intervalo => intervalo.nombre)
            .join(" / ");

        document.getElementById("mensaje").textContent =
            "Incorrecto. La respuesta es: " + nombresCorrectos;

        document.getElementById("mensaje").style.color =
            "#dc2626";
    }

    document.getElementById("aciertos").textContent = aciertos;
    document.getElementById("errores").textContent = errores;

    document.querySelectorAll("#opciones button").forEach(boton => {
        boton.disabled = true;
    });
}


// ---------------------------------
// INICIAR JUEGO
// ---------------------------------

nuevoEjercicio();

</script>

</body>
</html>
