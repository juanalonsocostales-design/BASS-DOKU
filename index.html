<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bass Dokus</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 15px;
    margin: 0;
    background: #f4f4f4;
}

h1 {
    margin-bottom: 8px;
}

#diapason {
    position: relative;
    width: 100%;
    max-width: 1280px;
    margin: 20px auto;
    line-height: 0;
}

#imagenBajo {
    display: block;
    width: 100%;
    height: auto !important;
    object-fit: contain;
}

/* Marcadores */

.nota {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
}

#tonica {
    background: #22c55e;
}

#notaAzul {
    background: #3b82f6;
}

/* Botones de respuesta */

#opciones {
    display: grid;
    grid-template-columns: repeat(4, minmax(65px, 140px));
    justify-content: center;
    gap: 8px;
    margin: 22px auto;
    padding: 0 10px;
}

#opciones button {
    background: #222;
    color: white;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 13px 8px;
    min-height: 44px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s;
}

#opciones button:hover:not(:disabled) {
    background: #444;
}

/* Respuesta correcta */

#opciones button.correcta {
    background: #16a34a;
    border-color: #15803d;
    color: white;
}

/* Respuesta incorrecta elegida */

#opciones button.incorrecta {
    background: #dc2626;
    border-color: #b91c1c;
    color: white;
}

#opciones button:disabled {
    cursor: default;
    opacity: 1;
}

#mensaje {
    min-height: 28px;
    font-weight: bold;
    margin: 15px;
}

#nuevo {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 12px;
}

#nuevo:hover {
    background: #1d4ed8;
}

#marcador {
    margin-top: 15px;
    font-size: 15px;
}

#explicacion {
    font-size: 12px;
    color: #666;
    margin-top: 18px;
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    .nota {
        width: 13px;
        height: 13px;
    }

    #opciones {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
    }

    #opciones button {
        font-size: 14px;
        padding: 12px 4px;
    }
}
</style>
