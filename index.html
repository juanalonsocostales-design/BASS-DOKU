<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bass Dokus</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f4f4f4;
    margin: 0;
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.pregunta {
    font-size: 18px;
    margin: 15px 0 25px;
}

#diapason {
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

#diapason img {
    display: block;
    width: 100%;
    height: auto;
}

.nota {
    position: absolute;
    width: clamp(14px, 2.5vw, 28px);
    height: clamp(14px, 2.5vw, 28px);
    border-radius: 50%;
    border: 3px solid white;
    transform: translate(-50%, -50%);
    z-index: 5;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    pointer-events: none;
}

.verde {
    background: #22c55e;
}

.azul {
    background: #3b82f6;
}

#respuestas {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    max-width: 650px;
    margin: 25px auto;
}

.respuesta {
    padding: 14px 5px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

.respuesta:hover:not(:disabled) {
    background: #444;
    transform: scale(1.04);
}

.respuesta:disabled {
    cursor: default;
    opacity: 0.8;
}

.correcta {
    background: #16a34a !important;
}

.incorrecta {
    background: #dc2626 !important;
}

#resultado {
    font-size: 20px;
    font-weight: bold;
    min-height: 30px;
    margin: 20px;
}

#nuevo {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
}

#nuevo:hover {
    background: #1d4ed8;
}

#estadisticas {
    margin: 20px;
    font-size: 17px;
}

#ayuda {
    max-width: 700px;
    margin: 15px auto;
    color: #666;
    font-size: 13px;
}

@media(max-width: 550px) {
    body {
        padding: 10px;
    }

    #respuestas {
        gap: 6px;
    }

    .respuesta {
        font-size: 15px;
        padding: 12px 3px;
    }
}

</style>
</head>

<body>

<h1>🎸 Bass Dokus</h1>

<p class="pregunta">
¿Qué intervalo es la nota azul respecto a la verde?
</p>

<div id="diapason">

    <img src="bass3.png" alt="Diapasón de bajo">

    <div id="tonica" class="nota verde"></div>

    <div id="notaAzul" class="nota azul"></div>

</div>

<div id="respuestas"></div>

<div id="resultado">
    ¡Identifica el intervalo!
</div>

<button id="nuevo" onclick="nuevoEjercicio()">
    Nuevo ejercicio
</button>

<div id="estadisticas">
    Aciertos: <span id="aciertos">0</span>
    &nbsp; | &nbsp;
    Errores: <span id="errores">0</span>
</div>

<div id="ayuda">
    Afinación estándar E-A-D-G · 20 trastes.
    La nota verde es la referencia.
</div>

<script>

// ==================================
// CONFIGURACIÓN DEL BAJO
// ==================================

const cuerdas = [
    { nombre: "E", midi: 28 },
    { nombre: "A", midi: 33 },
    { nombre: "D", midi: 38 },
    { nombre: "G", midi: 43 }
];

const NUM_TRASTES = 20;

const posicionesY = [
    46.2,
    50.8,
    55.3,
    59.7
];

const NUT_X = 78.4;
const FINAL_X = 3.1;

// ==================================
// INTERVALOS DISPONIBLES
// ==================================

const intervalos = [
    { nombre: "T", semitonos: 0 },
    { nombre: "b2", semitonos: 1 },
    { nombre: "2", semitonos: 2 },
    { nombre: "b3", semitonos: 3 },
    { nombre: "3", semitonos: 4 },
    { nombre: "4", semitonos: 5 },
    { nombre: "4#", semitonos: 6 },
    { nombre: "b5", semitonos: 6 },
    { nombre: "5", semitonos: 7 },
    { nombre: "5#", semitonos: 8 },
    { nombre: "b6", semitonos: 8 },
    { nombre: "6", semitonos: 9 },
    { nombre: "bb7", semitonos: 9 },
    { nombre: "b7", semitonos: 10 },
    { nombre: "7", semitonos: 11 }
];

// ==================================
// VARIABLES DEL JUEGO
// ==================================

let notaVerde;
let notaAzul;
let intervaloCorrecto;

let aciertos = 0;
let errores = 0;
let respondido = false;

// ==================================
// CALCULAR POSICIÓN DEL TRASTE
// ==================================

function calcularX(traste) {

    const escala =
        (NUT_X - FINAL_X) /
        (1 - Math.pow(2, -NUM_TRASTES));

    if (traste === 0) {

        const primerTraste =
            NUT_X - escala * (1 - Math.pow(2, -1));

        return (NUT_X + primerTraste) / 2;
    }

    const limiteAnterior =
        NUT_X - escala *
        (1 - Math.pow(2, -(traste - 1)));

    const limiteActual =
        NUT_X - escala *
        (1 - Math.pow(2, -traste));

    return (limiteAnterior + limiteActual) / 2;
}

// ==================================
// POSICIÓN ALEATORIA
// ==================================

function posicionAleatoria() {

    return {
        cuerda: Math.floor(Math.random() * 4),
        traste: Math.floor(Math.random() * 21)
    };

}

// ==================================
// NOTA MIDI
// ==================================

function obtenerMidi(posicion) {

    return cuerdas[posicion.cuerda].midi +
           posicion.traste;

}

// ==================================
// CALCULAR INTERVALO
// ==================================

function calcularIntervalo(verde, azul) {

    const midiVerde = obtenerMidi(verde);
    const midiAzul = obtenerMidi(azul);

    return Math.abs(midiAzul - midiVerde) % 12;

}

// ==================================
// COLOCAR CÍRCULOS
// ==================================

function colocarNota(elemento, posicion) {

    const x = calcularX(posicion.traste);
    const y = posicionesY[posicion.cuerda];

    elemento.style.left = x + "%";
    elemento.style.top = y + "%";

}

// ==================================
// INTERVALOS EQUIVALENTES
// ==================================

function buscarIntervalos(semitonos) {

    return intervalos.filter(
        i => i.semitonos === semitonos
    );

}

// ==================================
// BOTONES DE RESPUESTA
// ==================================

function crearRespuestas() {

    const contenedor =
        document.getElementById("respuestas");

    contenedor.innerHTML = "";

    intervalos.forEach(intervalo => {

        const boton = document.createElement("button");

        boton.className = "respuesta";
        boton.textContent = intervalo.nombre;

        boton.onclick = () => comprobarRespuesta(
            intervalo,
            boton
        );

        contenedor.appendChild(boton);

    });

}

// ==================================
// NUEVO EJERCICIO
// ==================================

function nuevoEjercicio() {

    respondido = false;

    document.getElementById("resultado").textContent =
        "¡Identifica el intervalo!";

    notaVerde = posicionAleatoria();

    do {

        notaAzul = posicionAleatoria();

    } while (
        notaVerde.cuerda === notaAzul.cuerda &&
        notaVerde.traste === notaAzul.traste
    );

    const semitonos =
        calcularIntervalo(notaVerde, notaAzul);

    intervaloCorrecto =
        buscarIntervalos(semitonos);

    colocarNota(
        document.getElementById("tonica"),
        notaVerde
    );

    colocarNota(
        document.getElementById("notaAzul"),
        notaAzul
    );

    crearRespuestas();

}

// ==================================
// COMPROBAR RESPUESTA
// ==================================

function comprobarRespuesta(intervalo, boton) {

    if (respondido) return;

    respondido = true;

    const correcta = intervaloCorrecto.some(
        i => i.nombre === intervalo.nombre
    );

    const botones =
        document.querySelectorAll(".respuesta");

    botones.forEach(b => b.disabled = true);

    if (correcta) {

        aciertos++;

        boton.classList.add("correcta");

        document.getElementById("resultado").textContent =
            "✓ ¡Correcto! Muy bien.";

    } else {

        errores++;

        boton.classList.add("incorrecta");

        const nombres = intervaloCorrecto
            .map(i => i.nombre)
            .join(" / ");

        document.getElementById("resultado").textContent =
            "✗ La respuesta era: " + nombres;

        botones.forEach(b => {

            if (
                intervaloCorrecto.some(
                    i => i.nombre === b.textContent
                )
            ) {
                b.classList.add("correcta");
            }

        });

    }

    document.getElementById("aciertos").textContent =
        aciertos;

    document.getElementById("errores").textContent =
        errores;

}

// ==================================
// INICIAR APLICACIÓN
// ==================================

nuevoEjercicio();

</script>

</body>
</html>
